name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.14-dev' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14-dev"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # `tree-sitter-languages>=1.10.0` is gated via `python_version < '3.13'` in
          # pyproject.toml because its latest release (1.10.2) ships wheels for cp310-cp312 only.
          # On 3.13+, `.[all,dev]` resolves cleanly and `outliner.extract_outline` falls back
          # transparently to regex outlining.
          pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not realgit"

      # The board tests drive REAL git in real repositories: two clones of one bare remote,
      # standing in for the two machines the teams sit on. They are the only honest check of
      # the property that matters -- two writers racing -- and they cost ~83 s, so they do
      # not run on all fourteen jobs.
      #
      # THE TWO JOBS ARE CHOSEN, NOT ARBITRARY:
      #   * Linux on the OLDEST supported Python, because the one failure these tests have
      #     ever had was version-specific -- `datetime.fromisoformat` on 3.10 only, with
      #     3.11, 3.12, 3.13 and 3.14 all green. Running them on 3.12 would have "fixed"
      #     that by not looking.
      #   * Windows, because paths, `os.replace` and git's handling of both differ there,
      #     and a Windows path is what broke the read ledger's key separator.
      - name: Run the real-git board tests
        if: >-
          (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10') ||
          (matrix.os == 'windows-latest' && matrix.python-version == '3.12')
        run: pytest tests/ -v --tb=short -m realgit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check . --ignore=E501,F401,UP035,UP036,UP045,UP006,I001,E741
